name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm ci
        working-directory: ./client
      - run: npm run lint
        working-directory: ./client
      - run: npm run build
        working-directory: ./client

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
        working-directory: ./server